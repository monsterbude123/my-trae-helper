name: V11 Gate

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  release:
    types: [published]

jobs:
  # ---- L1/L2 兜底 Gate：拦截本地 `--no-verify` 绕过 husky ----
  v11-gate-l12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify state card exists (L1 required)
        run: |
          SC=$(find docs/specs -name .state-card.md 2>/dev/null | head -1)
          if [ -z "$SC" ]; then
            echo "::error::No state card found — 必须先跑 V11 intake 初始化状态卡"
            exit 1
          fi
          echo "State card: $SC"

      - name: Run launch-guard self-check
        run: |
          for f in templates/hooks/launch-guard.sh scripts/launch-guard.sh; do
            if [ -f "$f" ]; then bash "$f"; exit $?; fi
          done
          echo "::warning::launch-guard.sh not found, skip self-check"

      - name: Run local L1/L2 scripts if configured
        run: |
          if [ -f package.json ]; then
            for s in lint typecheck test:unit test:integration test:coverage build; do
              if node -e "const p=require('./package.json');process.exit((p.scripts&&p.scripts['$s'])?0:1)" 2>/dev/null; then
                echo "==> npm run $s"
                npm ci 2>/dev/null || true
                npm run "$s" || exit 1
              fi
            done
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            python -m pytest tests/ 2>/dev/null || echo "::warning::no pytest tests"
          fi

  # ---- L3 Gate：PR merge（Stage 2/4/4.5 归并 + E2E）----
  v11-gate-l3:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run L3 guards (PR merge)
        run: |
          python scripts/validate-gate-config.py --config gates/gate-config.json
          python scripts/run-gate-level.py --level L3 \
            --config gates/gate-config.json \
            --project-root "$GITHUB_WORKSPACE" \
            --gates-yaml gates/gates.yaml

  # ---- L4 Gate：Release / tag（Stage 5 Accept + 安全审计）----
  v11-gate-l4:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run L4 guards (Release)
        run: |
          python scripts/validate-gate-config.py --config gates/gate-config.json
          python scripts/run-gate-level.py --level L4 \
            --config gates/gate-config.json \
            --project-root "$GITHUB_WORKSPACE" \
            --gates-yaml gates/gates.yaml