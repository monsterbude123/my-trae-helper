category: language
description: Node.js + JavaScript/TypeScript 项目（V11.8.7.1 全栈文档驱动开发流程）
files: files/
id: nodejs
name: Node.js (V12)
gate_mapping:
  L1:
    stage: 1/spec
    description: Stage 1 Spec 验证 — Spec 完整性 + 基础 lint
  L2:
    stage: 3.5/real-verify
    description: Stage 3.5 Real Verify — 代码与 Spec 一致性 + 全量测试
  L3:
    stage: 2/contract,4/review,4.5/rot-scan
    description: PR merge — 契约 + 评审 + 腐化扫描归并 + E2E
  L4:
    stage: 5/accept
    description: Release — Stage 5 Accept 验收归档 + 安全审计
post_actions:
- description: 初始化 husky
  path: .husky/pre-commit
  type: script
- description: 验证 scaffold 结构
  path: scripts/validate-scaffold.sh
  type: script
ci:
- description: V12 CI Gate（拦截 --no-verify 绕过本地 husky）
  template: templates/ci/v12-gate.yml
  dest: .github/workflows/v12-gate.yml
required_scripts:
  pre_commit:
  - lint
  - typecheck
  - test:unit
  pre_push:
  - test:integration
  - test:coverage
  - build
required_files:
  - package.json
  - docs/specs/changes/<change-id>/.state-card.md
  - AGENTS.md
state_card:
  path: docs/specs/changes/<change-id>/stage/-1/intake/.state-card.md
  stages:
    "-1/intake":
      description: 需求摄取阶段
      required_files:
        - docs/specs/changes/*/fact/intent.md
    "0/plan":
      description: 规划阶段
      required_files:
        - docs/specs/changes/*/fact/plan.md
    "0.5/test-plan":
      description: 测试计划阶段
      required_files:
        - docs/specs/changes/*/fact/test-plan.md
    "1/spec":
      description: 规格编写阶段
      required_files:
        - docs/specs/changes/*/fact/spec.md
    "1.5/prototype":
      description: 原型阶段
      required_files:
        - docs/specs/changes/*/fact/prototype.md
    "2/contract":
      description: 契约阶段
      required_files:
        - docs/specs/changes/*/fact/contracts/api-contracts.md
    "3/implement":
      description: 实现阶段
      required_files:
        - src/**/*.ts
    "3.5/real-verify":
      description: 验证阶段
      required_files:
        - tests/**/*.test.ts
    "4/review":
      description: 审查阶段
      required_files:
        - docs/specs/changes/*/stage/4/review/review-notes.md
    "4.5/rot-scan":
      description: 腐化扫描阶段
      required_files:
        - docs/specs/changes/*/stage/4.5/rot-scan/rot-scan-*.md
    "5/accept":
      description: 验收阶段
      required_files:
        - docs/specs/changes/*/stage/5/accept/ACCEPT_REPORT.md
    "6/bug-fix":
      description: Bug 修复阶段
      required_files:
        - tests/regression/**
    "7/health":
      description: 项目健康阶段
      required_files: []
tags:
- javascript
- typescript
- node
- v12
- fullstack
variables:
- default: my-v11-project
  description: 项目名称
  name: project_name
  required: true
- default: ''
  description: 作者
  name: author
  required: false
- default: '-1/intake'
  description: 初始 Stage
  name: initial_stage
  required: false
version: 1.0.0
