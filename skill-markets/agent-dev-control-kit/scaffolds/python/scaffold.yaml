  - ruff
  - mypy
  - pytest
  pre_push:
  - pytest
  - build
  required_files:
    - pyproject.toml
  build_backend: true
tags:
- python
- fastapi
- django
- flask
variables:
- default: my-project
  description: 项目名称
  name: project_name
  required: true
- default: ''
  description: 作者
  name: author
  required: false
version: 1.0.0