category: language
description: Node.js + JavaScript/TypeScript 项目（V11 全栈流程）
files: files/
id: nodejs
name: Node.js (V11)
gate_mapping:
  L1:
    stage: 1-spec
    description: Stage 1 Spec 验证 — Spec 完整性 + 基础 lint
  L2:
    stage: 3.5-verify
    description: Stage 3.5 Real Verify — 代码与 Spec 一致性 + 全量测试
  L3:
    stage: 2-contract,4-review,4.5-rot-scan
    description: PR merge — 契约 + 评审 + 腐化扫描归并 + E2E
  L4:
    stage: 5-accept
    description: Release — Stage 5 Accept 验收归档 + 安全审计
post_actions:
- description: 初始化 husky
  path: .husky/pre-commit
  type: script
- description: 验证 scaffold 结构
  path: scripts/validate-scaffold.sh
  type: script
ci:
- description: V11 CI 兜底 Gate（拦截 --no-verify 绕过本地 husky）
  template: templates/ci/v11-gate.yml
  dest: .github/workflows/v11-gate.yml
required_scripts:
  pre_commit:
  - lint
  - typecheck
  - test:unit
  pre_push:
  - test:integration
  - test:coverage
  - build
required_files:
  - package.json
  - docs/specs/.state-card.md
  - AGENTS.md
state_card:
  path: docs/specs/.state-card.md
  stages:
    "1-spec":
      description: 规格编写阶段
      required_files:
        - docs/specs/*.md
    "2-scaffold":
      description: 脚手架搭建阶段
      required_files:
        - src/
        - tests/
    "3-implement":
      description: 实现阶段
      required_files:
        - src/**/*.ts
    "3.5-verify":
      description: 验证阶段
      required_files:
        - tests/**/*.test.ts
    "4-review":
      description: 审查阶段
      required_files:
        - CHANGELOG.md
tags:
- javascript
- typescript
- node
- v11
- fullstack
variables:
- default: my-v11-project
  description: 项目名称
  name: project_name
  required: true
- default: ''
  description: 作者
  name: author
  required: false
- default: '1-spec'
  description: 初始 Stage
  name: initial_stage
  required: false
version: 1.0.0