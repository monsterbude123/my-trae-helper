# My Trae Helper — Skill Registration Registry (中央注册表)
#
# 设计目的（2026-08-14 §3 三层控制体系收紧方案 A）：
#   每个 skill 在本文件中按同名条目注册 guard + gate 引用,确保:
#     1. 每个 skill 必须有自己专属的 guard（项目侧 scripts/<name>-guard.*,不在 skill 子目录）
#     2. 每个 skill 必须有自己的 gate 路由条目（项目侧 .husky/<name>-gate 或 scripts/<name>-gate）
#     3. 只有 guard-smith agent 有写权维护此文件 + scripts/<name>-guard.* + .husky/<name>-gate
#     4. 其他 agent 试图 Edit 这些路径 → 强拦截 BLOCK（src/guards/skill-registration-guard.mjs 兜底）
#
# Schema 字段说明:
#   skill       : kebab-case,必须与 skill-markets/<skill>/SKILL.md 中 frontmatter name 一致
#   status      : active | deprecated | archived
#   guards      : 列表,每条 {id, category, script, triggers} - 守卫脚本相对路径(项目侧)
#   gates       : 列表,每条 {id, level, hooks, runs_guards} - 门禁 L1/L2/L3/L4 路由
#   maintainer  : 默认 "guard-smith",唯一允许修改的 agent 名
#   notes       : 自由备注
#
# 写入规则：
#   - 任何字段缺失 → 注册表守卫 BLOCK（缺 guard 即"无防护",缺 gate 即"无门禁"）
#   - skill 目录不存在或 SKILL.md 缺失 → 注册表守卫 BLOCK
#   - guards[].script 指向的文件不存在 → 注册表守卫 BLOCK
#   - gates[].hooks 中任一文件不存在 → 注册表守卫 BLOCK
#
# 兼容性策略：
#   - 存量 43 个 skill 全部标记 status: active,guards/gates 指向现有共享 guard 作为过渡
#   - guard-smith agent 后续按需把共享 guard 拆分到各自 <name>-guard.*,update 此文件即可
#   - 新建 skill 必带 1 个专属 guard + 1 个 gate 路由 → 由 create.mjs 强制写入此文件

