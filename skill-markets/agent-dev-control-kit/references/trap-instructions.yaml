      - 调用方式: argv 模式 `node scripts/agent-signal-detect.mjs "$msg"` 或 stdin `echo "$msg" | node ...`
      - 漏调检测: $HOME/.self-improving-agent/.learnings/ERRORS.md 长时间无新增 + ERRORS.md 比 FEATURE_REQUESTS.md 少
      - 已漏调: 立即跑一次 `node scripts/self-improving-agent.mjs scan-hints --home "$WIN_HOME"` 补救 + 在响应中声明 "[signal-recovery]"
