[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers -q
markers =
    unit: 纯函数/解析/校验测试(<50ms/用例)
    integration: 集成测试,涉及文件系统(<5s/用例)
    trap: 蒸馏自 references/traps.md 的反例固化测试
    slow: 真实环境/网络调用(默认跳过)
filterwarnings =
    ignore::DeprecationWarning