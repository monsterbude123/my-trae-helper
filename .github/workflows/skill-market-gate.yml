# Skill Market Gate — L3/L4 门禁
#
# L3 合并门禁: PR merge 时触发
# L4 发布门禁: Release 时触发

name: Skill Market Gate

on:
  pull_request:
    branches: [main, release/*]
    paths:
      - "skill-markets/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/skill-market-gate.yml"
      - ".github/workflows/agent-dev-control-kit-ci.yml"
  push:
    branches: [main]
    paths:
      - "skill-markets/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/skill-market-gate.yml"
      - ".github/workflows/agent-dev-control-kit-ci.yml"
  release:
    types: [published]

jobs:
  # L3 合并门禁
  L3-merge-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: L2 checks (L1 + 集成测试)
        run: |
          echo "Running L2 checks..."
          # 0. 注册表守卫（最严 — 每个 skill 必带同名 guard + gate 路由）
          # 仅 guard-smith agent 可改 registry/skills.yaml,此处 BLOCK = 阻止 PR merge
          node src/guards/skill-registration-guard.mjs

          # 1. 安全扫描（全部技能）
          python skill-markets/trae-security-review/scripts/scan_skills_dir.py skill-markets auto_reports

          # 2. 结构检查（变更的技能）
          CHANGED_SKILLS=$(git diff --name-only HEAD~1 HEAD | grep 'skill-markets/' | cut -d'/' -f2 | sort -u)
          if [ -n "$CHANGED_SKILLS" ]; then
            for skill in $CHANGED_SKILLS; do
              python scripts/skill-structure-guard.py "skill-markets/$skill"
            done
          fi

          # 3. 依赖检查（变更的技能）
          if [ -n "$CHANGED_SKILLS" ]; then
            for skill in $CHANGED_SKILLS; do
              node src/guards/skill-dependency-guard.mjs "$skill"
            done
          fi

          # 4. 能力检查（变更的技能）
          if [ -n "$CHANGED_SKILLS" ]; then
            for skill in $CHANGED_SKILLS; do
              python scripts/skill-capability-guard.py "skill-markets/$skill"
            done
          fi

          # 5. catalog-guard（agent-dev-control-kit 子套件 — PR 改它必跑）
          if echo "$CHANGED_SKILLS" | grep -q "agent-dev-control-kit"; then
            echo "🛡 agent-dev-control-kit catalog-guard ..."
            python scripts/run-agent-dev-control-kit-tests.py || {
              echo "❌ agent-dev-control-kit catalog-guard 失败"
              exit 1
            }
          fi

          # 5.5 Skill Bundle 守卫(L3 PR merge — 全量 + diff 跨包冲突,确保 PR 不引入新冲突)
          echo "5.5️⃣ Skill Bundle 守卫 (L3 all mode)..."
          python skill-markets/skill-acceptance/checks/07_bundle_structure.py --mode all || {
            echo "❌ Skill Bundle 守卫 L3 BLOCK"
            exit 1
          }

          # 5.6 fullstack4TraeV11 V11.5 L3 step（变更 V11 时跑）
          #     含 structure + flow + gate-config aspects（与 .husky/fullstack4TraeV11-pre-push 不同的 layer）
          V11_CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '^(skill-markets/fullstack4TraeV11/|scripts/fullstack4TraeV11-|registry/skills.yaml)' || true)
          if [ -n "$V11_CHANGED" ]; then
            echo "5.6️⃣ fullstack4TraeV11 V11.5 L3 step (structure+flow+gate-config)..."
            python scripts/fullstack4TraeV11-guard.py fullstack4TraeV11 || {
              echo "❌ fullstack4TraeV11 L3 BLOCK"
              exit 1
            }
          fi

      - name: Check CAPABILITY-MAP.md sync
        run: |
          git diff --exit-code skill-markets/CAPABILITY-MAP.md || {
            echo "❌ CAPABILITY-MAP.md 未同步"
            exit 1
          }

      - name: Check SECURITY-MAP.md sync
        run: |
          git diff --exit-code SECURITY-MAP.md || {
            echo "❌ SECURITY-MAP.md 未同步"
            exit 1
          }

      - name: Build CLI
        run: npm run build || echo "No build script defined"

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: auto_reports/

      - name: Upload agent-dev-control-kit hints + pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-dev-control-kit-hints
          path: skill-markets/agent-dev-control-kit/logs/
          retention-days: 7
          if-no-files-found: ignore

  # L4 发布门禁
  L4-publish-gate:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: L3 checks (全量扫描)
        run: |
          echo "Running L3 checks (full scan)..."
          # 0. 注册表守卫
          node src/guards/skill-registration-guard.mjs

          python skill-markets/trae-security-review/scripts/scan_skills_dir.py skill-markets auto_reports

          # 检查所有技能的结构
          for skill in skill-markets/*/; do
            skill_name=$(basename "$skill")
            if [ -f "$skill/SKILL.md" ]; then
              python scripts/skill-structure-guard.py "$skill" || {
                echo "❌ $skill_name 结构检查失败"
                exit 1
              }
            fi
          done

          # Skill Bundle 守卫 L4 all mode (灰度前最后一次全量 BLOCK 检查)
          echo "🛡 Skill Bundle 守卫 (L4 all mode,publish 前全量校验)..."
          python skill-markets/skill-acceptance/checks/07_bundle_structure.py --mode all || {
            echo "❌ Skill Bundle L4 BLOCK,禁止发布"
            exit 1
          }

          # catalog-guard（agent-dev-control-kit L4 必跑）
          if [ -d "skill-markets/agent-dev-control-kit" ]; then
            echo "🛡 agent-dev-control-kit catalog-guard (release) ..."
            python scripts/run-agent-dev-control-kit-tests.py || {
              echo "❌ agent-dev-control-kit catalog-guard 失败"
              exit 1
            }
          fi

          # fullstack4TraeV11 V11.5 L4 step（publish 前最后一次全量校验）
          #     含 flow + trap aspects（断言 trap 反例测试全 PASS）
          if [ -d "skill-markets/fullstack4TraeV11" ]; then
            echo "🛡 fullstack4TraeV11 V11.5 L4 step (flow + trap)..."
            python scripts/fullstack4TraeV11-flow-guard.py fullstack4TraeV11 || {
              echo "❌ fullstack4TraeV11 flow L4 BLOCK"
              exit 1
            }
            python scripts/fullstack4TraeV11-trap-guard.py fullstack4TraeV11 || {
              echo "❌ fullstack4TraeV11 trap L4 BLOCK"
              exit 1
            }
          fi

      - name: Skill market integrity check
        run: |
          echo "检查技能市场完整性..."
          # 验证所有技能都在 CAPABILITY-MAP.md 注册
          for skill in skill-markets/*/; do
            skill_name=$(basename "$skill")
            if [ -f "$skill/SKILL.md" ]; then
              node src/guards/skill-dependency-guard.mjs "$skill_name" || echo "⚠️ $skill_name 依赖检查失败"
              python scripts/skill-capability-guard.py "$skill" || echo "⚠️ $skill_name 能力检查失败"
            fi
          done

      - name: Publish to npm (灰度)
        run: npm publish --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for validation
        run: sleep 300

      - name: Promote to latest
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm dist-tag add @my-trae-helper/cli@$VERSION latest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-reports
          path: |
            auto_reports/
            logs/