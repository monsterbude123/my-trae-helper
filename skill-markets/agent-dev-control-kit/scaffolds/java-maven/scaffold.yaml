category: language
description: Java 项目，使用 Maven 构建
files: files/
id: java-maven
name: Java (Maven)
post_actions:
- description: 初始化项目
  path: scripts/init.sh
  type: script
required_scripts:
  pre_commit:
  - mvn
  pre_push:
  - mvn
  required_files:
    - pom.xml
  pom_must_contain:
    - maven-checkstyle-plugin
    - jacoco-maven-plugin
tags:
- java
- maven
- spring
variables:
- default: my-project
  description: 项目名称
  name: project_name
  required: true
- default: ''
  description: 作者
  name: author
  required: false
version: 1.0.0