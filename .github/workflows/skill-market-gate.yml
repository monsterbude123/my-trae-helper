# Skill Market Gate — L3/L4 门禁
#
# L3 合并门禁: PR merge 时触发
# L4 发布门禁: Release 时触发

name: Skill Market Gate

on:
  pull_request:
    branches: [main, release/*]
    paths:
      - "skill-markets/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".agents/rules/**"
      - ".agents/skills/**"
      - "AGENTS.md"
      - "README.md"
      - "CHANGELOG.md"
      - "SECURITY-MAP.md"
      - ".github/workflows/skill-market-gate.yml"
      - ".github/workflows/agent-dev-control-kit-ci.yml"
  push:
    branches: [main]
    paths:
      - "skill-markets/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".agents/rules/**"
      - ".agents/skills/**"
      - "AGENTS.md"
      - "README.md"
      - "CHANGELOG.md"
      - "SECURITY-MAP.md"
      - ".github/workflows/skill-market-gate.yml"
      - ".github/workflows/agent-dev-control-kit-ci.yml"
  release:
    types: [published]

jobs:
  # L3 合并门禁
  L3-merge-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: L2 checks (L1 + 集成测试)
        run: |
          echo "Running L2 checks..."
          # 0. 注册表守卫（最严 — 每个 skill 必带同名 guard + gate 路由）
          # 仅 guard-smith agent 可改 registry/skills.yaml,此处 BLOCK = 阻止 PR merge
          node src/guards/skill-registration-guard.mjs

          # 1. 安全扫描（全部技能）
          python skill-markets/trae-security-review/scripts/scan_skills_dir.py skill-markets auto_reports

          # 2. 结构检查（变更的技能）
          CHANGED_SKILLS=$(git diff --name-only HEAD~1 HEAD | grep 'skill-markets/' | cut -d'/' -f2 | sort -u)
          if [ -n "$CHANGED_SKILLS" ]; then
            for skill in $CHANGED_SKILLS; do
              python scripts/skill-structure-guard.py "skill-markets/$skill"
            done
          fi

          # 3. 依赖检查（变更的技能）
          if [ -n "$CHANGED_SKILLS" ]; then
            for skill in $CHANGED_SKILLS; do
              node src/guards/skill-dependency-guard.mjs "$skill"
            done
          fi

          # 4. 能力检查（变更的技能）
          if [ -n "$CHANGED_SKILLS" ]; then
            for skill in $CHANGED_SKILLS; do
              python scripts/skill-capability-guard.py "skill-markets/$skill"
            done
          fi

          # 5. catalog-guard（agent-dev-control-kit 子套件 — PR 改它必跑）
          if echo "$CHANGED_SKILLS" | grep -q "agent-dev-control-kit"; then
            echo "🛡 agent-dev-control-kit catalog-guard ..."
            python scripts/run-agent-dev-control-kit-tests.py || {
              echo "❌ agent-dev-control-kit catalog-guard 失败"
              exit 1
            }
          fi

          # 5.5 Skill Bundle 守卫(L3 PR merge — 全量 + diff 跨包冲突,确保 PR 不引入新冲突)
          echo "5.5️⃣ Skill Bundle 守卫 (L3 all mode)..."
          python skill-markets/skill-acceptance/checks/07_bundle_structure.py --mode all || {
            echo "❌ Skill Bundle 守卫 L3 BLOCK"
            exit 1
          }

          # 5.6 fullstack4TraeV11 V11.5 L3 step（变更 V11 时跑）
          #     含 structure + flow + gate-config aspects（与 .husky/fullstack4TraeV11-pre-push 不同的 layer）
          V11_CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '^(skill-markets/fullstack4TraeV11/|scripts/fullstack4TraeV11-|registry/skills.yaml)' || true)
          if [ -n "$V11_CHANGED" ]; then
            echo "5.6️⃣ fullstack4TraeV11 V11.5 L3 step (structure+flow+gate-config)..."
            python scripts/fullstack4TraeV11-guard.py fullstack4TraeV11 || {
              echo "❌ fullstack4TraeV11 L3 BLOCK"
              exit 1
            }
            # 5.6.1 V11 unit tests 全量（含 test_new_bug_source_field.py 等 unit marker 测试）
            echo "5.6.1️⃣ fullstack4TraeV11 V11 unit tests (L3)..."
            python -m pytest skill-markets/fullstack4TraeV11/tests/unit -q || {
              echo "❌ fullstack4TraeV11 V11 unit tests L3 BLOCK"
              exit 1
            }
          fi

      - name: Check CAPABILITY-MAP.md sync
        run: |
          git diff --exit-code skill-markets/CAPABILITY-MAP.md || {
            echo "❌ CAPABILITY-MAP.md 未同步"
            exit 1
          }

      - name: Check SECURITY-MAP.md sync
        run: |
          git diff --exit-code SECURITY-MAP.md || {
            echo "❌ SECURITY-MAP.md 未同步"
            exit 1
          }

      # 5.7 protocol-coverage 检查(V11.8.0+ 协议先行 + 多维度一致,2026-08-15 NEW)
      #     检测 protocols/<topic>-protocol.md 是否被 6 维度(SKILL/ref/workflow/script/guard/other-refs)全引用
      #     任一维度缺失 → BLOCK
      - name: Protocol coverage gate (protocol-first + multi-dim sync)
        run: |
          echo "5.7️⃣ Protocol coverage 检查(协议先行 + 多维度一致)..."
          CHANGED_PROTOCOLS=$(git diff --name-only HEAD~1 HEAD | grep -E '(references|skills)/.*-protocol\.md$' || true)
          CHANGED_RULES=$(git diff --name-only HEAD~1 HEAD | grep -E '^\.agents/rules/.*\.md$' || true)
          CHANGED_TARGETS="$CHANGED_PROTOCOLS $CHANGED_RULES"
          if [ -n "$CHANGED_TARGETS" ]; then
            echo "   检测到的协议/规则变更:"
            echo "$CHANGED_TARGETS" | sed 's/^/     - /'
            for target in $CHANGED_TARGETS; do
              if [ -f "$target" ]; then
                # 包内协议 (.md 在 skill-markets/) → --scope package
                # 项目级规则 (.agents/rules/) → --scope global
                if echo "$target" | grep -qE '^\.agents/rules/'; then
                  SCOPE="global"
                else
                  SCOPE="package"
                fi
                python scripts/_check_protocol_coverage.py \
                  --protocol "$target" \
                  --scope "$SCOPE" \
                  --check || {
                  echo "❌ Protocol coverage gate BLOCK: $target (scope=$SCOPE) 缺维度引用"
                  echo "   处置: 参考 .agents/skills/project-rule-skill/references/skill-creation-workflow.md §2 多维度同步约束(V11.8.0.1 路径迁移)"
                  exit 1
                }
              fi
            done
          else
            echo "   无协议/规则变更,跳过"
          fi

      # 5.8 skill-catalog 检查(V11.8.0+ 协议先行 + 多维度一致,2026-08-15 NEW)
      #     校验变更的 SKILL.md 满足 tests/catalogs/skill-catalog.yaml 必填字段
      #     V1 report-only 模式 — 仅报告,不阻断;--strict 才 FAIL
      - name: Skill catalog gate (metadata validation, V1 report-only)
        run: |
          echo "5.8️⃣ Skill catalog 元数据校验(report-only 模式)..."
          CHANGED_SKILLS_MD=$(git diff --name-only HEAD~1 HEAD | grep -E 'skill-markets/.*/SKILL\.md$' || true)
          if [ -n "$CHANGED_SKILLS_MD" ]; then
            for skill_md in $CHANGED_SKILLS_MD; do
              skill_dir=$(dirname "$skill_md")
              skill_name=$(basename "$skill_dir")
              echo "   检查: $skill_name"
            done
          fi
          # 全量跑(report-only)
          python tests/catalogs/_check_skill_catalog.py \
            --catalog tests/catalogs/skill-catalog.yaml \
            --skills-root skill-markets || {
            echo "⚠ skill-catalog 报告发现错误,但 V1 report-only 不阻断"
            echo "  → 处置见 tests/catalogs/catalog-protocol.md §3 + SKILL.md frontmatter 补全"
          }

      - name: Build CLI
        run: npm run build || echo "No build script defined"

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: auto_reports/

      - name: Upload agent-dev-control-kit hints + pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-dev-control-kit-hints
          path: skill-markets/agent-dev-control-kit/logs/
          retention-days: 7
          if-no-files-found: ignore

  # L4 发布门禁
  L4-publish-gate:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: L3 checks (全量扫描)
        run: |
          echo "Running L3 checks (full scan)..."
          # 0. 注册表守卫
          node src/guards/skill-registration-guard.mjs

          python skill-markets/trae-security-review/scripts/scan_skills_dir.py skill-markets auto_reports

          # 检查所有技能的结构
          for skill in skill-markets/*/; do
            skill_name=$(basename "$skill")
            if [ -f "$skill/SKILL.md" ]; then
              python scripts/skill-structure-guard.py "$skill" || {
                echo "❌ $skill_name 结构检查失败"
                exit 1
              }
            fi
          done

          # Skill Bundle 守卫 L4 all mode (灰度前最后一次全量 BLOCK 检查)
          echo "🛡 Skill Bundle 守卫 (L4 all mode,publish 前全量校验)..."
          python skill-markets/skill-acceptance/checks/07_bundle_structure.py --mode all || {
            echo "❌ Skill Bundle L4 BLOCK,禁止发布"
            exit 1
          }

          # catalog-guard（agent-dev-control-kit L4 必跑）
          if [ -d "skill-markets/agent-dev-control-kit" ]; then
            echo "🛡 agent-dev-control-kit catalog-guard (release) ..."
            python scripts/run-agent-dev-control-kit-tests.py || {
              echo "❌ agent-dev-control-kit catalog-guard 失败"
              exit 1
            }
          fi

          # fullstack4TraeV11 V11.5 L4 step（publish 前最后一次全量校验）
          #     含 flow + trap aspects（断言 trap 反例测试全 PASS）
          if [ -d "skill-markets/fullstack4TraeV11" ]; then
            echo "🛡 fullstack4TraeV11 V11.5 L4 step (flow + trap)..."
            python scripts/fullstack4TraeV11-flow-guard.py fullstack4TraeV11 || {
              echo "❌ fullstack4TraeV11 flow L4 BLOCK"
              exit 1
            }
            python scripts/fullstack4TraeV11-trap-guard.py fullstack4TraeV11 || {
              echo "❌ fullstack4TraeV11 trap L4 BLOCK"
              exit 1
            }
            # L4 unit tests 全量（含 test_new_bug_source_field.py 等 unit marker 测试）
            echo "🛡 fullstack4TraeV11 V11 unit tests (L4)..."
            python -m pytest skill-markets/fullstack4TraeV11/tests/unit -q || {
              echo "❌ fullstack4TraeV11 V11 unit tests L4 BLOCK"
              exit 1
            }
          fi

      # 5.7 protocol-coverage 全量检查(L4 publish 前 — 全部包内协议 + 项目级规则跑一遍)
      - name: Protocol coverage gate (L4 full scan)
        run: |
          echo "🛡 protocol-coverage 全量检查(L4 publish 前)..."
          # 全部包内协议
          PROTOCOLS=$(find skill-markets -type f -name '*-protocol.md' 2>/dev/null || true)
          # 全部项目级规则
          RULES=$(find .agents/rules -type f -name '*.md' 2>/dev/null || true)
          ALL_TARGETS="$PROTOCOLS $RULES"
          if [ -n "$ALL_TARGETS" ]; then
            for target in $ALL_TARGETS; do
              if [ -f "$target" ]; then
                if echo "$target" | grep -qE '^\.agents/rules/'; then
                  SCOPE="global"
                else
                  SCOPE="package"
                fi
                python scripts/_check_protocol_coverage.py \
                  --protocol "$target" \
                  --scope "$SCOPE" \
                  --check || {
                  echo "❌ L4 protocol coverage BLOCK: $target (scope=$SCOPE)"
                  exit 1
                }
              fi
            done
          fi

      # 5.8 skill-catalog L4 全量(L4 publish 前 — 全量 catalog 检查 + report-only)
      - name: Skill catalog gate (L4 full scan)
        run: |
          echo "🛡 skill-catalog L4 全量(publish 前最后一次 metadata 校验)..."
          python tests/catalogs/_check_skill_catalog.py \
            --catalog tests/catalogs/skill-catalog.yaml \
            --skills-root skill-markets || {
            echo "⚠ L4 skill-catalog 报告发现错误,但 V1 report-only 不阻断"
          }

      - name: Skill market integrity check
        run: |
          echo "检查技能市场完整性..."
          # 验证所有技能都在 CAPABILITY-MAP.md 注册
          for skill in skill-markets/*/; do
            skill_name=$(basename "$skill")
            if [ -f "$skill/SKILL.md" ]; then
              node src/guards/skill-dependency-guard.mjs "$skill_name" || echo "⚠️ $skill_name 依赖检查失败"
              python scripts/skill-capability-guard.py "$skill" || echo "⚠️ $skill_name 能力检查失败"
            fi
          done

      - name: Publish to npm (灰度)
        run: npm publish --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for validation
        run: sleep 300

      - name: Promote to latest
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm dist-tag add @my-trae-helper/cli@$VERSION latest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-reports
          path: |
            auto_reports/
            logs/