# trap-instructions.yaml — 反例 → 指令映射(M3)
#
# 角色定位:
#   - 仓库内不建 .learnings/ 目录(由全局 self-improving-agent 统一管理)
#   - 本文件是仓库内"反例 → 修复指令"的机器可读源 — pytest trap 测试从这里校验字段
#   - 字段命名刻意避开 ai-short-studio-monster .learnings/ 风格
#     (Logged / Priority / Status / Reproducible / Related Files / Source),
#     避免与 self-improving-agent 全局 schema 冲突
#
# 每条反例至少含:
#   - id/title:                唯一标识 + 一句话标题
#   - detect_signal:           触发该反例的检查函数 / 关键词
#   - what_is_wrong:           反例的现象(为什么是错的)
#   - fix_template_before:     ❌ 错误示例
#   - fix_template_after:      ✅ 正确示例
#   - next_skill:              agent 应当调用哪个 Skill
#   - next_skill_action:       调用的具体动作
#   - reclaim_steps:           agent 拿到该 hint 后应走的步骤
#   - see_also:                交叉引用

version: 1.0.0

traps:
  # ─────────────────────────────────────────────────────────────────
  - id: AP-1
    title: 过度流程化(单文件纯新增)
    detect_signal: "改动文件数 ≤ 3 且无跨系统组件"
    what_is_wrong: |
      对单文件新增硬套三层控制(Execution + Guard + Gate),执行成本远高于风险。
    fix_template_before: |
      ❌ 对单文件新增:走完整 Execution CP1~CP6 + 4 个 Guard + 4 级 Gate
    fix_template_after: |
      ✅ 仅跑 lint,免 Execution / 备份 / 审计 / 结构 Guard
    next_skill: trae-ponytail
    next_skill_action: "识别为开发阶段 → 简化流程"
    reclaim_steps:
      - 评估改动文件数 < 3 且无跨系统 → 豁免三层控制
      - 仅跑必要 gate(L1)
      - 在 commit message 注明"single-file addition, gate waived"
    see_also: ["agent-dev-control-kit §0.3 不适用场景"]

  # ─────────────────────────────────────────────────────────────────
  - id: AP-2
    title: Gate 静默跳过不存在脚本
    detect_signal: |
      GATE_FAKE_BODY_PATTERNS 命中 / is_echo_skip() = True
    what_is_wrong: |
      pre-commit 用 `if command -v npm && grep -q 'lint' package.json` 形式的判断,
      当 lint 缺失时**整体跳过**且不报错,exit 0,假通过。
    fix_template_before: |
      # ❌ pre-commit
      if command -v npm &> /dev/null && grep -q '"lint"' package.json; then
        echo "1️⃣ Lint..."
        npm run lint
      fi
    fix_template_after: |
      # ✅ pre-commit
      if ! grep -q '"lint"' package.json; then
        echo "❌ Gate 配置错误: package.json 缺少 lint 脚本"
        exit 1
      fi
      echo "1️⃣ Lint..."
      npm run lint
    next_skill: trae-ponytail
    next_skill_action: "最小修改 gate 脚本,把条件检查翻转"
    reclaim_steps:
      - 找到触发 Gate(pre-commit / pre-push / catalog-guard)
      - 看是否存在 'echo skipping' 或 'if command -v X && ... then' 模式
      - 改为 'if not ...; then echo err; exit 1; fi'
      - 跑 pytest -m trap 验证
    see_also:
      - "agent-dev-control-kit §11.1.2"
      - "scripts/validate-gate-integrity.py (含 V2-NODEJS-ECHO-SKIP 阻断)"

  # ─────────────────────────────────────────────────────────────────
  - id: AP-3
    title: Guard 缺 CLI 自执行入口
    detect_signal: |
      必填 CLI 脚本(来自 catalog.required_scripts.is_cli=true)缺 __main__ 块
    what_is_wrong: |
      Guard 脚本只有 export runXxx() 但无 main,
      `python script.py` 仅加载模块,runXxx 从未被调用,exit 0 假通过。
    fix_template_before: |
      # ❌ src/guard.py
      export async function runGuard(args) { ... }
    fix_template_after: |
      # ✅ src/guard.py
      export async function runGuard(args) { ... }

      const isMain = import.meta.url === `file:///${process.argv[1].replace(/\\/g, '/')}`;
      if (isMain) runGuard(process.argv.slice(2));
    next_skill: trae-ponytail
    next_skill_action: "加 if __name__ == '__main__' 块"
    reclaim_steps:
      - 找到 catalog 中 is_cli=true 的脚本
      - 确认末尾有 `if __name__ == '__main__': sys.exit(main())`
      - ESM 用 `import.meta.url === 'file:///' + ...`
      - 跑 pytest -m trap -k AP-3 验证
    see_also:
      - "agent-dev-control-kit §11.1.1"
      - "tests/catalogs/test_catalog_coverage.py::test_required_scripts_have_cli_entry"

  # ─────────────────────────────────────────────────────────────────
  - id: AP-CAT-DOCS
    title: 缺管理/模块文档阻断
    detect_signal: |
      catalog.required_docs 中声明的 path 不存在
    what_is_wrong: |
      新功能/模块添加后未对应创建文档,导致知识缺口。
    fix_template_before: |
      # ❌ 新加 src/canvas/feature.ts 但没 docs/feature.md
    fix_template_after: |
      # ✅ 创建 docs/feature.md (≥ 50 行,含 API 列表 / 示例 / 验收)
      # ✅ 在 tests/catalogs/skill-catalog.yaml 同步注册
    next_skill: web-app-development
    next_skill_action: "用 prose 模板起草功能文档"
    reclaim_steps:
      - 看 stderr HINT-AP-CAT-001,定位哪个 path 缺失
      - 创建对应文件 + 起骨架内容
      - 把 SKILL.md 章节补完(目录 / 适用 / API)
      - 在 catalog 加 'required_docs' 条目
      - 跑 pytest tests/catalogs 验证
    see_also:
      - "ai-short-studio-monster tests/contracts/route-catalog.ts"

  # ─────────────────────────────────────────────────────────────────
  - id: AP-CAT-SECTIONS
    title: 缺 page 元素(章节锚点)
    detect_signal: |
      catalog.required_sections 中声明的 heading 在 in_file 中不存在
    what_is_wrong: |
      文档有,但缺关键章节锚点,导致目录 / 索引失效。
    fix_template_before: |
      # ❌ SKILL.md 没有 ## §0 定位 章节
    fix_template_after: |
      # ✅ 在 SKILL.md 加
      ## §0 定位

      ...(≥ 50 字描述)
    next_skill: web-app-development
    next_skill_action: "用 prose 模板生成对应章节"
    reclaim_steps:
      - 看 stderr HINT-AP-CAT-004,定位缺哪个 heading
      - 在 in_file 中加 `## <heading>` + 50+ 字正文
      - 跑 pytest tests/catalogs 验证
    see_also: []

  # ─────────────────────────────────────────────────────────────────
  - id: AP-CAT-SCHEMA
    title: 缺某个新增 schema 字段
    detect_signal: |
      catalog.required_schema_fields 中 dotted path 不存在
    what_is_wrong: |
      新增 resource / gate / guard 时未在 registry 中登记。
    fix_template_before: |
      # ❌ src/lib/asset-hub/... 加了新 endpoint 但 registry 缺
    fix_template_after: |
      # ✅ registry/stacks.yaml 加新 stack
      - id: my-stack
        name: "我的栈"
        scaffold: "scaffolds/my-stack"
      # ✅ 在 catalog 加 required_schema_fields
      - in_file: registry/stacks.yaml
        path: "stacks[*].id"
    next_skill: trae-ponytail
    next_skill_action: "加 yaml 字段 + 同步 catalog"
    reclaim_steps:
      - 看 stderr HINT-AP-CAT-005,定位哪个 dotted path 缺失
      - 在 in_file 中加对应字段(或在 catalog 移除过期声明)
      - 跑 pytest -m trap 验证
    see_also:
      - "references/traps.md §AP-7"

  # ─────────────────────────────────────────────────────────────────
  - id: AP-CAT-DOCS-LANG
    title: 缺中英双写文档
    detect_signal: |
      对应 ai-short-studio-monster AGENTS.md §2:修改/新增功能必须同步 content/zh/* 与 content/en/*
    what_is_wrong: |
      只写了一侧语言(zh / en)的文档,另一侧缺失。Agent 提示系统强制"中英双写",单侧文档被 catalog 检测为缺口。
    fix_template_before: |
      # ❌ 加了 content/zh/canvas/nodes.mdx 但没加 content/en/canvas/nodes.mdx
      # ❌ 加了 content/en/assets/index.mdx 但没加 content/zh/assets/index.mdx
    fix_template_after: |
      # ✅ 双侧同时加
      #    content/zh/<path>.mdx
      #    content/en/<path>.mdx
      # ✅ 在 tests/catalogs/skill-catalog.yaml 加 required_docs 双侧声明
      - path: content/zh/canvas/nodes.mdx
      - path: content/en/canvas/nodes.mdx
    next_skill: trae-ponytail
    next_skill_action: "复制 + 翻译 + 双侧注册"
    reclaim_steps:
      - 看 stderr HINT-AP-CAT-002,定位缺哪一侧
      - 复制已有侧到目标路径
      - 翻译 + 校对人名/术语
      - 在 skill-catalog.yaml 双侧同时声明
      - 跑 pytest tests/catalogs -m trap 验证
    see_also:
      - "ai-short-studio-monster AGENTS.md §2"
      - "references/traps.md §AP-CAT-DOCS"

  # ─────────────────────────────────────────────────────────────────
  - id: AP-CAT-META-REGISTER
    title: 缺 _meta.ts 导航注册
    detect_signal: |
      对应 ai-short-studio-monster AGENTS.md §2:新增页面 / API / 工作流必须注册两侧 _meta.ts
    what_is_wrong: |
      新建了 content/zh/<section>/<page>.mdx 但没在 content/zh/<section>/_meta.ts 与 content/en/<section>/_meta.ts 注册,导致导航/面包屑/目录找不到该页面。
    fix_template_before: |
      # ❌ 加了 content/zh/canvas/nodes.mdx
      #    但 content/zh/canvas/_meta.ts 与 content/en/canvas/_meta.ts 都没注册 nodes 条目
    fix_template_after: |
      # ✅ content/zh/canvas/_meta.ts
      export default {
        index: '总览',
        nodes: '节点',
      } as const
      # ✅ content/en/canvas/_meta.ts
      export default {
        index: 'Overview',
        nodes: 'Nodes',
      } as const
    next_skill: trae-ponytail
    next_skill_action: "在双侧 _meta.ts 注册"
    reclaim_steps:
      - 看 stderr HINT-AP-CAT-META-001,定位缺哪个 _meta.ts
      - 在双侧 _meta.ts 中加入对应 key
      - key 与文件名(去掉 .mdx)严格一致
      - 跑 npm run check:docs-sync 验证
    see_also:
      - "ai-short-studio-monster AGENTS.md §2"
      - "references/traps.md §AP-CAT-SECTIONS"

  # ─────────────────────────────────────────────────────────────────
  - id: AP-8
    title: post-commit 假阻断(SIA 不可用时 exit 0)
    detect_signal: |
      git commit 之后,post-commit 钩子退出码非 0 / "command not found" 报错
    what_is_wrong: |
      post-commit 调 self-improving-agent reflect 时,如果 SIA CLI 不在 PATH,
      直接 exit 1,会让 git 误以为提交后动作失败,污染 commit 体验。
      反过来:如果 SIA 存在但 HOME 不存在,盲目调用会导致写入失败。
    fix_template_before: |
      # ❌ post-commit (直接调用,失败 exit)
      "$SIA" reflect --auto || exit 1   # 阻断 commit
    fix_template_after: |
      # ✅ post-commit (探测式降级,不阻断)
      SIA="$(command -v self-improving-agent)" || exit 0
      [ -d "${SELF_IMPROVING_HOME:-$HOME/.self-improving-agent}" ] || exit 0
      "$SIA" reflect --auto --quiet || true   # 失败仅 warn,不阻断
    next_skill: trae-ponytail
    next_skill_action: "探测 + 失败降级"
    reclaim_steps:
      - 必须 `set +e`(默认不阻断)
      - 用 `command -v` 探测 SIA 可用性
      - 用 `[ -d "$HOME/.self-improving-agent" ]` 探测 HOME 可写性
      - 失败一律 `exit 0`,仅写 logs/post-commit-self-improve.log
      - 跑 bash tests/unit/test_post_commit_self_improving.sh 自验收
    see_also:
      - ".trae/rules/learning.md §5 路径 C"
      - "AGENTS.md §2.4 Gate 自验收强制"

  # ─────────────────────────────────────────────────────────────────
  # 2026-08-14 第二轮蒸馏新增(本会话踩坑)
  - id: AP-9
    title: git commit --no-verify 绕过 pre-commit hook(违反 Gate 强制铁律)
    detect_signal: |
      git log --oneline 出现由 --no-verify 提交的 commit /
      .husky/pre-commit 失败但 commit 仍成功 / user 明确反对 agent 用 --no-verify
    what_is_wrong: |
      pre-commit hook 是 L1 Commit Gate,失败必须阻断。任何用 --no-verify 绕过都是
      "Gate 假通过",等于 agent 自废门禁。AGENTS.md §2.4 + agent-dev-control-kit
      §11.1.4 都强制"Gate 失败必须报告,不能'自动回滚'却无日志"。
    fix_template_before: |
      # ❌ 用 --no-verify 绕过 hook(2026-08-14 本会话踩坑)
      git commit --no-verify -m "feat: ..."
      # 后果:hook 没跑 → user 看 commit "成功" → 实际 Gate 全无
    fix_template_after: |
      # ✅ hook 失败必须修 root cause,真跑真验
      bash .husky/pre-commit 2>&1 | tail -20   # 看错
      # 修脚本 bug / 环境探测 / 缺失依赖 → 重跑
      bash .husky/pre-commit                    # 必须 exit 0
      git commit -m "feat: ..."                 # 真跑 hook
    next_skill: agent-dev-control-kit
    next_skill_action: "走 Gate 自验收协议(§11.1.1-§11.1.4)"
    reclaim_steps:
      - 禁止:任何情况用 --no-verify 提交
      - 必须:hook fail → 修 root cause → 重跑 → 真 PASS
      - 修不好:输出 [blocking-report] 等 user 决策
      - 若已用 --no-verify:git reset --soft HEAD~1 撤回 + 修 root cause 再重提
    see_also:
      - "AGENTS.md §2.4 Gate 自验收强制"
      - "agent-dev-control-kit §11.1.4"

  # ─────────────────────────────────────────────────────────────────
  - id: AP-10
    title: Python 多条件布尔表达式缺括号(短路语义陷阱)
    detect_signal: |
      grep -E "if .+ or .+ and .+:" 或 grep -E "if .+ and .+ or .+:" 在 *.py 文件
      该文件无配套单测覆盖布尔语义
    what_is_wrong: |
      Python `a or b and c` 解析为 `a or (b and c)`,与直觉 `(a or b) and c` 不同。
      布尔判定 bug 隐蔽、测试难覆盖、运行生产后才暴露。
    fix_template_before: |
      # ❌ 短路语义错(本会话 manifest-assert.py v初版 bug)
      if '__name__' not in text or 'def main' not in text and 'argv' not in text:
          missing.append(...)
      # 实际是:('__name__' not in text) or (('def main' not in text) and ('argv' not in text))
    fix_template_after: |
      # ✅ 显式括号分组 + 提取命名变量
      has_cli = (
          "__name__" in text and ("__main__" in text or "argv" in text)
      ) or ("argparse" in text)
      if not has_cli:
          missing.append(...)
    next_skill: trae-ponytail
    next_skill_action: "代码风格审查"
    reclaim_steps:
      - 任何 `X or Y and Z` / `X and Y or Z` 必须显式 `(X) and (Y) or (Z)` 或 `(X or Y) and (Z)`
      - 提取命名变量(has_cli / has_main / has_argv)减少出错
      - 给布尔判定加单测覆盖 True/False 全组合
    see_also:
      - "Python PEP 8 — Boolean Operators"

  # ─────────────────────────────────────────────────────────────────
  - id: AP-11
    title: 改非本任务范围的预先存在 bug(违反最小变更)
    detect_signal: |
      git diff 显示本任务无关文件的修改 / commit message 提到
      "fix: 预存 bug" 但本任务 PRD 未要求
    what_is_wrong: |
      本任务是加 Bridge Gate,但顺手改了 skill-security-guard.py 的
      'python' 硬编码(预存 bug)。污染 diff、违反最小变更、
      模糊任务边界、增加 review 负担。
    fix_template_before: |
      # ❌ 顺手修预存 bug
      # 本任务:加 Bridge Gate
      git add scripts/intent-classifier.mjs scripts/manifest-assert.py
      git add scripts/skill-security-guard.py   # 顺手改预存 bug,污染 diff
    fix_template_after: |
      # ✅ 判定:跑 verify 确认 bug 真阻断当前 Gate → 改 → 单独立 commit
      # 不阻断 → 写到 docs/backlog.md 下次再处理
      git add scripts/intent-classifier.mjs scripts/manifest-assert.py
      # skill-security-guard.py 的 'python' 硬编码 → 不在本次 commit
      # 写 docs/backlog.md:
      #   - [ ] fix: skill-security-guard.py subprocess 用 sys.executable
      #         阻塞链:hook step 3 → Gate L1
    next_skill: trae-ponytail
    next_skill_action: "最小变更审查"
    reclaim_steps:
      - 任何修改前问:这个 bug 真阻断当前 Gate 吗?
      - 阻断 → 修,但单独立 commit,标 "fix: 预存 ... bug"
      - 不阻断 → docs/backlog.md,本任务不碰
    see_also:
      - "AGENTS.md §2 铁律 #7 最小变更"

  # ─────────────────────────────────────────────────────────────────
  - id: AP-12
    title: 给出未经验证的具体数字(应付性响应)
    detect_signal: |
      agent 数字声明(如 "43 个 skill" / "全部 N 个")与
      实际 ls/glob/Read 计数不符 / user 反复纠正同一数字
    what_is_wrong: |
      agent 接收 user 给的数字(可能是 user 记错),不第一轮做精确核对,
      默默按错数字做,user 反复纠正。违反 AGENTS.md §4 "有数据精度
      问题就说" + session-distiller §3.5 "Completion Report 真实性"。
    fix_template_before: |
      # ❌ user 说 43 → agent 不核对 → 默默按 39 做 → user 反复问
      user: "扩到 43 个"
      agent: <生成 39 个>
      user: "扩到 43 个" (第二次)
      agent: "实际是 39 不是 43"(第二次才纠正)
    fix_template_after: |
      # ✅ 第一轮就核对 + 列精确清单
      user: "扩到 43 个"
      agent: "先核:ls skill-markets/ 含 SKILL.md 的有 N 个 →
              实际 39 个,与您说的 43 差 4 个。请确认是按 39 全扩,
              还是您记错了?有 4 个可能需要新建。"
    next_skill: trae-ponytail
    next_skill_action: "数据精度检查"
    reclaim_steps:
      - 任何数字声明必须第一轮带证据(ls / glob / Read)
      - 与 user 给的数字不一致 → 第一轮就纠正,不是默默做
      - 找不到 → 立即报告,不是估算
    see_also:
      - "AGENTS.md §4 行为规约 数据精度"
      - "session-distiller §3.5"

  # ─────────────────────────────────────────────────────────────────
  - id: AP-13
    title: 主 agent 漏调 signal-detect(用户纠正/不耐慎/特性请求永久丢失)
    detect_signal: |
      $HOME/.self-improving-agent/.learnings/ERRORS.md 长时间无新增 /
      FEATURE_REQUESTS.md 长时间无新增 但用户消息含 AGENTS.md §3.1 表态信号
      (懂了吗/你确定/不对/能 XXX 吗/应该/为什么/怎么)
    what_is_wrong: |
      主 agent 接收用户消息后未调 `scripts/agent-signal-detect.mjs`,
      用户表态信号(纠正/不耐慎/特性请求)未落入 logs/agent-hints.jsonl,
      post-commit 钩子也无 hint 可消费 → 用户真实反馈永久丢失。
      违反 .trae/skills/project-rule-skill/SKILL.md §7 强制契约。
    fix_template_before: |
      # ❌ 主 agent 自作主张跳 signal-detect(2026-08-14 本会话踩坑)
      user: "懂了吗" / "你确定这样行吗" / "能自动调 signal 吗"
      agent: <直接答>   # 跳过 signal-detect → hint 永久丢失
    fix_template_after: |
      # ✅ 每个新 turn 第一条响应前 + 含表态信号时 + commit/test 失败回显前
      #    都必须调 signal-detect(参考 SKILL.md §7.1 触发时机表)
      user: "懂了吗"
      agent:
        # Step 1: 立即调 signal-detect(stdin 模式)
        result=$(echo "懂了吗" | node scripts/agent-signal-detect.mjs 2>&1)
        hits=$(echo "$result" | grep -c "detected")
        # Step 2: 响应开头声明 [signal-scanned] 标记
        echo "[signal-scanned] hits=$hits files=[agent-hints.jsonl]"
        # Step 3: 正常回应用户
    next_skill: trae-ponytail
    next_skill_action: "响应开头必含 [signal-scanned] 标记"
