  - id: AP-14
    title: 给 P0/P1/P2 配硬性条数(无出处的分组配额)
    detect_signal: |
      文本含模式 `P1.*\d+\s*(条|个)` / `P2.*\d+\s*(条|个)` /
      `几条落地` / `几条留空` / `每档.*≥\s*\d+` /
      `P1.*两条.*P2.*三条` 等任意优先级 + 数字配额短语
    what_is_wrong: |
      给 P0/P1/P2 优先级配硬性条数(例 "P1 两条落地 + P2 三条留空"),
      全仓 0 命中出处(2026-08-14 会话已 grep 验证),
      属于临时口头约定误传成规则。违反:
      - AGENTS.md §4 #2 "不挂 P0/P1/P2/P3 backlog"
      - AGENTS.md §4 #6 (2026-08-14 新增) "不给 P0/P1/P2 配硬性条数"
      - ponytail §过度工程(无意义限制)
    fix_template_before: |
      # ❌ 给优先级配数字(全仓无出处,反例)
      user: "P1 两条落地 + P2 三条留空"
      agent: <默默按 2+3 做,无核对,无质疑>
      agent: "P1 完成 2 条,P2 留 3 条"   # 把临时话当规则
    fix_template_after: |
      # ✅ 第一轮就质疑无出处的硬数字
      user: "P1 两条落地 + P2 三条留空"
      agent: "先核:仓库无此规则出处(全仓 0 命中)。
              - AGENTS.md §4 #2 是'不挂 P0/P1/P2/P3 backlog'
              - fullstack4TraeV11 §16.1 是'P0/P1 修复或升级方案
                必走质疑性校验'(不是分条数量)
              建议:回归 §4 #2,完成/部分/失败三选一,
              不挂分档配额。如要落地新规则,先沉淀到
              global self-improving-agent LEARNING(2026-08-14 §1 路由)。"
    next_skill: trae-ponytail
    next_skill_action: "无意义限制清理 + §4.1.1 数字证据核对"
    reclaim_steps:
      - 触发:用户给出 "P1/P2/P3 + 几条/几个/≥N" 组合
      - 第一轮动作:Grep `P[0-3].*\d+\s*(条|个)|几条落地` 全仓,验证无出处
      - 无出处 → 在响应中明确标注 "全仓 0 命中,无规则出处",不默默执行
      - 出处存在 → 走对应规则原文,不在响应中改写数字
      - 净化方向:回归 §4 #2 三选一(完成/部分/失败),不挂分档配额
      - 反向钉死:见 AGENTS.md §4 #6 + 本条 detect_signal;pytest trap 测试用 detect_signal 模式断言
    see_also:
      - "AGENTS.md §4 #2 不挂 P0/P1/P2/P3 backlog"
      - "AGENTS.md §4 #6 不给 P0/P1/P2 配硬性条数(2026-08-14 新增)"
      - "AGENTS.md §4.1.1 数字必须第一轮带证据"
      - ".trae/rules/learning.md §1 全局自管经验沉淀"

  # ─────────────────────────────────────────────────────────────────
  # 2026-08-14 第二轮蒸馏再次修正(用户纠正)
  - id: AP-15
    title: Git Hook 探测到 Python 但缺依赖时不补装(矫枉过正)
    detect_signal: |
      scripts/detect-python.sh / .husky/pre-commit / pre-push 含
      "缺 pytest/yaml,BLOCK" / "请手动 pip install" 等字样 /
      没有尝试 python -m pip install --user 自愈
    what_is_wrong: |
      第一轮修正时为了"跨平台"只信 PATH 上的 python3,但用户机器装了 Python
      只是忘装 pytest 时,hook 必然失败。这是矫枉过正 — hook 存在的目的是
      真跑守卫,不是反复 prompt 用户装环境。
      反过来想: 用户既然 commit 了,说明已装 Git; 同理应能接受自动
      pip install --user(写到 ~/.local,不污染系统)。
    fix_template_before: |
      # ❌ 只探测,不补装(矫枉过正,2026-08-14 用户纠正)
      if _can_import "$PY2"; then PY="$PY2"; break; fi
      # 若缺 pytest/yaml → 直接 BLOCK → 用户每次 commit 都卡
    fix_template_after: |
      # ✅ 探测 + 自愈 + 降级提示
      if _can_import "$PY2"; then
        PY="$PY2"; break
      elif _try_bootstrap "$PY2"; then   # 内部跑 python -m pip install --user
        PY="$PY2"; break
      fi
      # 仍失败 → 才打印三平台安装指南 + exit 1
    next_skill: trae-ponytail
    next_skill_action: "矫枉过正识别 + 自愈优先"
    reclaim_steps:
      - 触发:任何"探测环境/能力"的脚本(不限于 Python)
      - 第一轮动作:问"缺了能不能自愈?(pip install / npm install / brew install)"
      - 能自愈 → 加 _try_bootstrap 路径,不阻断主流程
      - 真不能(无网/无权限) → 才 BLOCK + 明确修复指南
      - 反向钉死:detect_signal 关键词必须命中"自愈尝试"或"明确非自愈原因"
    see_also:
      - "AGENTS.md §4.1.3 跨平台 Python 探测 + 自愈依赖"
      - "scripts/detect-python.sh _try_bootstrap"
      - "ponytail §矫枉过正(从反例变正例)"
