  - id: V11-AP15
    title: archive 路径必须配置化,禁止文档/脚本独立硬编码 **[SUPERSEDED by V11-AP16]**
    severity: HIGH
    status: superseded
    superseded_by: V11-AP16
    what_is_wrong: |
      V11 SKILL 5 个脚本(init-from-zero.py × 2 / spec-purge.py / proactive-scan.py / stage-gate.py)
      独立硬编码 archive 路径,产生 3 个不同路径:

        - docs/specs/archive/             (project-structure.md L81-83 文档示意)
        - docs/specs/changes/archive/     (init-from-zero.py L265 创建 + L349 校验)
        - docs/archive/done/              (spec-purge.py L70 写入 + Constitution Article VIII)

      文档描述和脚本执行不一致 → agent 解读路径漂移 → 归档工件可能写到错误位置,
      违反 V11 §3.7 #10 "禁止文档与实现漂移"。
    detect_signal: |
      1. grep -E 'docs/archive|docs/specs/archive|docs/specs/changes/archive' scripts/*.py
         → 应 0 命中(所有引用必须经 _lib_paths.get_archive_dir / get_changes_archive_dir)
      2. grep -E '"docs/archive"|"docs/specs/(changes/)?archive"' scripts/*.py
         → 应 0 命中(脚本中禁止硬编码路径字符串,除 _lib_paths.py 默认值外)
      3. .trae/fullstack4traev11.config.yaml 应含 paths.archive + paths.changes_archive 字段
      4. scripts/_lib_paths.py 应存在 + 含 load_paths / get_archive_dir / get_changes_archive_dir 三函数
      5. spec-purge.py / init-from-zero.py / proactive-scan.py / stage-gate.py 必须 try/except ImportError fallback
    fix_template_before: |
      # ❌ scripts/spec-purge.py L70 硬编码
      archive_dir = project_root / f"docs/archive/done/{change_id}"

      # ❌ scripts/init-from-zero.py L265 硬编码
