[pytest]
# 主仓 pytest 配置 — 与子包(agent-dev-control-kit/tests/pytest.ini)解耦
#
# 关键:
#   - testpaths = tests  → 严格限定主仓测试目录
#   - 不上溯到子包 conftest(本配置 rootdir = 主仓根)
#
# 子包测试通过 scripts/run-agent-dev-control-kit-tests.py 独立跑,
# 不通过主仓 pytest 入口。

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers -q
markers =
    slow: 真实环境/网络调用(默认跳过)
filterwarnings =
    ignore::DeprecationWarning
