      dirs = [..., paths_cfg["changes_archive"], ...]

      # ✅ .trae/fullstack4traev11.config.yaml paths 字段
      paths:
        archive: docs/archive/done
        changes_archive: docs/specs/changes/archive
    next_skill: trae-ponytail
    next_skill_action: "路径引用必走 _lib_paths 函数,禁止脚本中硬编码字符串"
    reclaim_steps:
