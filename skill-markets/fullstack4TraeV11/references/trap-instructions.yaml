# trap-instructions.yaml — V11 反例 → 指令映射（flow 层机器可读源）
#
# 角色定位:
#   - 仓库内不建 .learnings/ 目录（由全局 self-improving-agent 统一管理）— 见 .trae/rules/learning.md §1
#   - 本文件是仓库内"反例 → 修复指令"的机器可读源 — pytest trap 测试从这里校验字段
#   - 字段命名刻意避开全局 self-improving-agent schema（Logged / Priority / Status /
#     Reproducible / Related Files / Source），避免冲突 — 见 learning.md §3
#
# V11 语境: 本文件只管 V11 特有反例（门禁硬化 / flow 层可解析），
# 跨会话通用经验走全局 self-improving-agent，不复制进本文件。

version: 1.0.0

traps:
  # ─────────────────────────────────────────────────────────────────
  - id: V11-T1
    title: Gate 软通过（只查脚本存在不执行）
    detect_signal: |
      gate 脚本只有 `if [ -f xxx.py ]` 判断，命中后仅打印不真跑 /
      `run-all-guards.py --validate-only` 被误当"真跑"使用
    what_is_wrong: |
      V11 门禁硬化的核心是"真跑真验"。只检查脚本存在与否、不执行检查逻辑，
      则 agent 可提供空壳脚本骗过 Gate，exit 0 假通过。
    fix_template_before: |
      # ❌ gate 只查存在
      if [ -f scripts/spec-validate-hook.py ]; then
        echo "spec-validate-hook.py 存在，PASS"
      fi
    fix_template_after: |
      # ✅ 真跑检查逻辑，失败即 exit 非 0
      python scripts/spec-validate-hook.py || { echo "spec gate FAIL"; exit 1; }
    next_skill: trae-ponytail
    next_skill_action: "最小修改 gate 脚本，把存在性判断替换为真实执行"
    reclaim_steps:
      - 找到触发 Gate（pre-commit / pre-push / CI job）
      - 看是否存在 `if [ -f … ]` 后仅 echo 不执行的模式
      - 改为真实调用脚本 + 失败 exit 非 0
      - 自验收：造空壳脚本 → Gate 必须 BLOCK
    see_also: ["registry/README.md 设计原则 #4 脚本统一消费"]

  # ─────────────────────────────────────────────────────────────────
  - id: V11-T2
    title: echo-skip 占位符脚本
    detect_signal: |
      package.json scripts 含 `echo "skipping lint"` / `echo skip` 等
      （run-gate-level.py is_echo_skip() 命中）
    what_is_wrong: |
      用 echo 占位假装脚本存在，npm run 立即成功，Gate 假通过。
    fix_template_before: |
      # ❌ package.json
      "scripts": { "lint": "echo \"skipping lint\"" }
    fix_template_after: |
      # ✅ 真实命令
      "scripts": { "lint": "eslint src/" }
    next_skill: trae-ponytail
    next_skill_action: "识别占位符并替换为真实工具命令"
    reclaim_steps:
      - 跑 run-gate-level.py，看 reason=echo-skip-detected
      - 替换 scripts 为真实 lint/typecheck/test 命令
      - 重跑 Gate 必须真 PASS
    see_also: ["scaffolds/nodejs/files/scripts/run-gate-level.py is_echo_skip"]

  # ─────────────────────────────────────────────────────────────────
  - id: V11-T3
    title: --no-verify 绕过本地 husky（L1/L2 假通过）
    detect_signal: |
      git log 出现由 --no-verify 提交的 commit / .huspy/pre-commit 失败但 commit 仍成功
    what_is_wrong: |
      L1/L2 由本地 husky 强制，--no-verify 整体绕过，等于自废门禁。
      CI 层（L3/L4 v11-gate.yml）是兜底，但本地若长跑 --no-verify 会累积脏状态。
    fix_template_before: |
      # ❌
      git commit --no-verify -m "feat: ..."
    fix_template_after: |
      # ✅ 真跑真验
      bash .husky/pre-commit 2>&1 | tail -20   # 看错
      git commit -m "feat: ..."                 # 真跑 hook
    next_skill: agent-dev-control-kit
    next_skill_action: "走 Gate 自验收协议"
    reclaim_steps:
      - 禁止任何情况用 --no-verify 提交
      - hook fail → 修 root cause → 重跑 → 真 PASS
      - 已用 --no-verify → git reset --soft HEAD~1 撤回 + 修后再提
    see_also: ["AGENTS.md §2.4 Gate 自验收强制"]

  # ─────────────────────────────────────────────────────────────────
  - id: V11-T4
    title: stage 无门禁（13 stage 每 stage 必登记）
    detect_signal: |
      gates.yaml 中 gate 数量 ≠ 13 / 某 stage 在 gates.yaml 无对应条目
      （run-all-guards.py count_note 命中）
    what_is_wrong: |
      V11 铁律"每 stage 必有一门禁"。缺门禁 stage 无法被程序化断言，
      是"13 个 stage 只有 2 个硬化"问题的根因。
    fix_template_before: |
      # ❌ gates.yaml 缺某 stage 条目
      gates: [ stage-intake, stage-plan, ... ]  # 少 1 个
    fix_template_after: |
      # ✅ 13 stage 全登记
      gates:
        - { id: stage-health, stage: "7/health", script: stage-gate.py, ... }
    next_skill: trae-ponytail
    next_skill_action: "补登记的 stage 门禁"
    reclaim_steps:
      - 跑 run-all-guards.py 看 count_note
      - 定位缺哪个 stage
      - 在 gates.yaml 补登记该 stage 门禁
      - 重跑必须 13/13 PASS
    see_also: ["registry/gates.yaml", "registry/README.md 设计原则 #3"]

  # ─────────────────────────────────────────────────────────────────
  - id: V11-T5
    title: flow 层 yaml 不可解析（可解析性铁律）
    detect_signal: |
      registry/*.yaml 无法被 yaml.safe_load / json.load 解析 /
      结构校验缺主键（run-all-guards.py table FAIL）
    what_is_wrong: |
      flow 层设计为纯程序化解析，人类/agent 不硬读。yaml 不可解析 →
      脚本无法消费 → 门禁无法断言，退回"agent 硬读 md"老路。
    fix_template_before: |
      # ❌ registry/stacks.yaml 顶层不是 dict 或缺 stacks 主键
      stacks: "not-a-list"
    fix_template_after: |
      # ✅ 合法结构
      version: 1.0.0
      stacks:
        - id: nodejs
          name: Node.js
    next_skill: trae-ponytail
    next_skill_action: "修复 yaml 结构，使其可被 yaml.safe_load 解析 + schema 校验"
    reclaim_steps:
      - 跑 run-all-guards.py 看 table FAIL
      - python -c "import yaml; yaml.safe_load(open('registry/stacks.yaml'))"
      - 修复结构 + 补主键
      - 重跑必须 5 表全 PASS
    see_also: ["registry/README.md 设计原则 #4", "scripts/run-all-guards.py TABLES"]

  # ─────────────────────────────────────────────────────────────────
  - id: V11-T6
    title: gate-config.json 与 registry 档位映射漂移
    detect_signal: |
      gate-config.json 的 stage 字段与 gates.yaml 的 stage 命名不一致 /
      scaffold.yaml gate_mapping 与 gate-config.json levels 不一致
    what_is_wrong: |
      L1-L4 档位映射（gate-config.json）和 registry（gates.yaml）是 flow 层双源，
      一旦漂移，CI 强制的档位与 stage 门禁脱节，门禁形同虚设。
    fix_template_before: |
      # ❌ gate-config.json L3 stage 写 "2-contract,4,4.5"
      #    gates.yaml 实际 stage 命名 "2/contract,4/review,4.5/rot-scan"
    fix_template_after: |
      # ✅ 统一用 gates.yaml 的 stage id 命名
      "stage": "2/contract,4/review,4.5/rot-scan"
    next_skill: trae-ponytail
    next_skill_action: "统一 stage 命名，消除双源漂移"
    reclaim_steps:
      - 对比 gate-config.json levels[*].stage 与 gates.yaml gates[*].stage
      - 统一命名格式
      - 跑 validate-gate-config.py 校验
    see_also: ["scaffolds/nodejs/files/gates/gate-config.json", "registry/gates.yaml"]

  # ─────────────────────────────────────────────────────────────────
  # V11.7.0 贾维斯体系反例（防 agent 改标准通过自己）
  # ─────────────────────────────────────────────────────────────────
  - id: V11-JARVIS-BYPASS-LOCK
    title: 跳过贾维斯委派直接改 gate-config.json
    severity: HIGH
    what_is_wrong: "未走 [JARVIS-DELEGATION] 委派,直接 Edit gates/gate-config.json(白名单路径),意图放宽 gate"
    detect_signal: "agent 改了 gate-config.json/.husky/* 但没产出 [JARVIS-DELEGATION] 头部 + lock 未重签"
    next_skill_action: "拒绝改动,要求委派贾维斯;若已发生篡改,跑 gate-integrity-guard.py --verify 必 BLOCK"
    reclaim_steps:
      - 主 agent 拒绝接收后续 gate 相关请求
      - 跑 gate-integrity-guard.py --verify,确认已被篡改 → 记录全局 self-improving-agent ERROR
      - 恢复文件 → gate-integrity-guard.py --generate(干净状态下生成新 lock)
      - 真要改 → 走 [JARVIS-DELEGATION] 头部委派贾维斯
    see_also: ["skills/00-boot/agents/jarvis.md §3 白名单", "scripts/gate-integrity-guard.py"]

  - id: V11-JARVIS-FORCE-WITHOUT-AUDIT
    title: 强制 --generate 未附 --reason 审计
    severity: HIGH
    what_is_wrong: "verify BLOCK 状态下跑 gate-integrity-guard.py --generate 试图固化为新基线(漏洞),或在篡改态加 --force 但不附 --reason"
    detect_signal: "lock.yaml 含 '# forced: true' 但 reason 字段为空/占位"
    next_skill_action: "拒绝接收 lock,要求附 [JARVIS-DELEGATION] 委派编号(可追溯到会话审计)"
    reclaim_steps:
      - 不接受该 lock,要求重签附 reason='[JARVIS-DELEGATION] 委派编号 + 阈值变更描述'
      - 若 reason 是 'test' / '临时' / '调试' 等占位 → 打回重写
      - 强制重签理由必须含用户原话或合规变更证据
    see_also: ["scripts/gate-integrity-guard.py --force --reason", "skills/00-boot/agents/jarvis.md §5"]

  - id: V11-JARVIS-OVERRIDE-LAYER
    title: 改 L-module 检查项跨层挂到 L-system
    severity: MEDIUM
    what_is_wrong: "把模块 CRUD 单测(L-module)塞进 L3 merge gate(L-system),使小改动也跑全量 E2E,要么浪费时间要么让重跑变难"
    detect_signal: "gate-config.json 中 L3.checks 含 lint/typecheck/test:unit 等 L-module 项"
    next_skill_action: "贾维斯按分层模型拒绝,要求各检查项回到正确层"
    reclaim_steps:
      - 把 L-module 检查项移回 L1(L-module)
      - L2(L-app)放模块集成 + 契约对齐
      - L3(L-system)放 E2E + AC 核销 + 腐化扫描
      - 重签 lock
    see_also: ["skills/00-boot/agents/jarvis.md §2 分层模型", "registry/gates.yaml layer 字段"]

  # ─────────────────────────────────────────────────────────────────
  # V11.8.1 bug-hunt / E2E 跨 stage 实战段反例（蒸馏自 2026-08-15 90 min / 14 模块 / 16 bug 全流程）
  # ─────────────────────────────────────────────────────────────────

  - id: V11-BH1
    title: 跳过 fixture 手写真登录（受 auth 保护路由 → signin 重定向假证据）
    severity: HIGH
    what_is_wrong: |
      受 supabase auth 保护的路由（/zh/home、/zh/workspace/*、/zh/admin/* 等），
      主代理一上来就 playwright_navigate + playwright_screenshot，跳过 signin 凭据注入。
      middleware 静默重定向到 signin（无 error overlay），截图是登录表单，
      主代理凭"navigate 200 OK = 到达目标页"误判成功。
    detect_signal: |
      grep -rE "playwright_(navigate|fill).*signin" tests/e2e/ 命中（fixture 之外也算违规）
      或 docs/bugs/*/BUG-*.md evidence 段 visible_text 含"邮箱"/"password"等登录表单关键字
      但 status 字段 = OPEN（已落单未察觉假证据）
    fix_template_before: |
      # ❌ 子代理手写真登录 7 步
      playwright_navigate /zh/home
      playwright_screenshot  # 截图是 signin 表单
    fix_template_after: |
      # ✅ 受 auth 保护路由必走 7 步（或 fixture）
      # 临时取证走 7 步（详见 skills/12-bug-fix/references/bug-hunt-battle-report.md §2）
      playwright_navigate /zh/auth/signin
      playwright_fill email + playwright_fill password + playwright_click submit
      等 1-2s 让 supabase 写 session
      playwright_navigate <target_route>
      playwright_get_visible_text  # ★必含期望路由关键字（如"欢迎回来"）
      playwright_screenshot
      archive-screenshot.ps1 -Slug <bug-id>-<state> -SubDir bug-hunt
    next_skill: bug-hunt-tooling
    next_skill_action: "临时取证走 §2 真登录 7 步；长期 e2e 走 auth-fixture.ts signedInPage"
    reclaim_steps:
      - 复用 skills/12-bug-fix/references/bug-hunt-battle-report.md §2 M2.6 visible_text 必查
      - visible_text 含"邮箱"/"password" → 100% 假证据 → 回到 M2.3 重走
      - 长期 e2e 测试改 import { test, expect } from 'tests/e2e/fixtures/auth-fixture'
      - 子代理委派必含 [TOOL-HINTS] 头部（详见 skills/12-bug-fix/references/bug-hunt-battle-report.md §5）
    see_also:
      - "skills/12-bug-fix/references/bug-hunt-battle-report.md §8 反例 1"
      - "skills/12-bug-fix/references/bug-hunt-phase-a.md §A.1"
      - "skills/12-bug-fix/SKILL.md §铁律 6"

  - id: V11-BH2
    title: 14 模块主代理串行未委派（违反 V11 §1.6 委派纪律）
    severity: MEDIUM
    what_is_wrong: |
      bug hunt spec 列出 ≥7 个模块（14 模块属重度场景），主代理按顺序 navigate 串行。
      V11 §1.6 反 AI 自律：≤6 Task + LOW 风险 → 主代理亲自；>6 Task 或 ≥MEDIUM → 必委派。
      14 模块 = 14 Task > 6，应拆 3 sub-agent × ~5 模块并行。
    detect_signal: |
      spec 列模块数 > 6 + 主代理亲自 navigate（sub-agent 委派数为 0）
      或 tasks.md A3.x 段无 sub-agent 委派记录
    fix_template_before: |
      # ❌ 主代理亲自跑 14 模块串行
      for module in M1..M14: navigate + visible_text + screenshot
      # 耗时 ~42 min
    fix_template_after: |
      # ✅ 拆 3 sub-agent 并行（每 agent ~5 模块）
      sub_agent_1: [M1 home, M2 art-style, M3 character, M4 asset, M5 script]
      sub_agent_2: [M6 storyboard, M7 shot, M8 video, M9 voice, M10 music]
      sub_agent_3: [M11 export, M12 publish, M13 analytics, M14 admin]
      # 耗时 ~15 min（节约 27 min）
    next_skill: bug-hunt-tooling
    next_skill_action: "spec 阶段就识别'模块数 = Task 数'，必委派"
    reclaim_steps:
      - 主代理 spec 阶段按 V11 §1.6 判定模块数 vs Task 数
      - ">=6 模块 → 必委派 sub-agent 并行（拆 3 agent × ~5 模块）"
      - 每个 sub-agent 必含 [TOOL-HINTS] 头部（参见 skills/12-bug-fix/references/bug-hunt-battle-report.md §5）
      - 主代理职责 = 监控 + 拼接 + 状态卡同步（不亲自 navigate）
    see_also:
      - "skills/12-bug-fix/references/bug-hunt-battle-report.md §8 反例 2"
      - "skills/12-bug-fix/references/bug-hunt-phase-a.md §A.2"
      - "skills/12-bug-fix/SKILL.md §铁律 8"
      - "V11 SKILL.md §1.6 主上下文自律条款"

  - id: V11-BH3
    title: bug 单手填 6 字段（无 new-bug.sh 模板化）
    severity: MEDIUM
    what_is_wrong: |
      V11 §8 bug 单 6 字段（bug_id / module / observed_at / route / evidence / severity）
      未脚本化，每次重跑一遍手填。16 个 bug 单每单 1 min 手填 = 16 min 浪费。
    detect_signal: |
      grep "generated by new-bug.sh" docs/bugs/*/BUG-*.md | wc -l 应等于 bug 单总数
      若 < bug 单总数 → 部分手填
    fix_template_before: |
      # ❌ 手写 .md 含全 6 字段
      cat > docs/bugs/<date>/BUG-017.md <<EOF
      | bug_id | BUG-017 |
      | module | M4-asset |
      | observed_at | 2026-08-15T... |
      | route | /zh/workspace/asset-hub |
      | severity | L2 |
      | status | OPEN |
      EOF
    fix_template_after: |
      # ✅ 跑 new-bug.sh（6 字段机器生成，主代理只补 Description + Fix）
      bash scripts/bug-hunt/new-bug.sh BUG-017 M4-asset /zh/workspace/asset-hub L2 "evidence"
    next_skill: bug-hunt-tooling
    next_skill_action: "bug 单生成必走 new-bug.sh；禁止手写 6 字段模板"
    reclaim_steps:
      - 复用 skills/12-bug-fix/references/bug-hunt-battle-report.md §6.1 6 字段定义
      - 复用 scripts/bug-hunt/new-bug.sh 模板
      - 字段填错 → 重跑 new-bug.sh 覆盖（不手动 Edit）
      - 自验收：grep "generated by new-bug.sh" 必须 100% 命中
    see_also:
      - "references/skills/12-bug-fix/references/bug-hunt-battle-report.md §6.1 + §8 反例 3"
      - "V11 SKILL.md §8 Bug 录入触发条件"

  - id: V11-BH4
    title: 修复后 bug 单 status 未回写（三文件状态分裂）
    severity: HIGH
    what_is_wrong: |
      sub-agent 修完 BUG-NNN 后，bug 单 .md 文件 status: OPEN 字段未改；
      主代理只在 index.md 标 FIXED。状态分散在两个文件，index.md 和 BUG-NNN.md 不一致。
      主代理二次扫 bug 列表时按 BUG-NNN.md 判定 → 误判 OPEN → 重复委派修复。
    detect_signal: |
      grep -l "^| status | OPEN" docs/bugs/<change>/BUG-*.md 命中
      而 docs/bugs/index.md 同一行已标 FIXED → 状态分裂
      或 docs/bugs/.state-card.md BUG-NNN 状态落后于实际
    fix_template_before: |
      # ❌ 只改 index.md，bug 单 .md status 仍 OPEN
      sed -i 's|BUG-003 | OPEN | BUG-003 | FIXED|' docs/bugs/index.md
      # bug 单 .md 仍 OPEN → 主代理二次误判
    fix_template_after: |
      # ✅ 三文件同步（bug 单 .md + index.md + .state-card.md）
      # sub-agent report 末尾必含 close-bug.sh
      bash scripts/bug-hunt/close-bug.sh BUG-003 <agent-id>
      # 反向校验：3 个 grep 必须 0 命中
      grep -l "^| status | OPEN" docs/bugs/<change>/BUG-003*.md  # → 0
      grep -lE "^\s*-\s*\[" docs/bugs/index.md | xargs grep -L "FIXED"  # → 0
    next_skill: bug-hunt-tooling
    next_skill_action: "sub-agent report 模板必含 status 回写步骤 + 必跑 close-bug.sh"
    reclaim_steps:
      - 复用 skills/12-bug-fix/references/bug-hunt-battle-report.md §6.2 三文件同步守恒
      - sub-agent 修复委派必含 [TOOL-HINTS] + sed -i 三文件步骤
      - 主代理验收必跑反向校验 3 个 grep
      - 任何 1 个 grep 命中 → 🛑 REJECT sub-agent 报告
    see_also:
      - "references/skills/12-bug-fix/references/bug-hunt-battle-report.md §6.2 + §8 反例 4"
      - "V11 SKILL.md §8 Bug 录入触发条件 + state-card-protocol.md §3"

  - id: V11-BH5
    title: HMR stale 反复重 navigate（≥3 次未跑 dev-hmr-recovery.ps1）
    severity: MEDIUM
    what_is_wrong: |
      dev server Next.js 15.5+ Turbopack + Windows 高频 navigate 偶发 stale cache。
      playwright_navigate 后 playwright_get_visible_text 仍为空 + dev server 日志含
      Module not found / ChunkLoadError → 主代理倾向"再试一次"心态，反复重 navigate。
      5+ 次重 navigate + 5+ 次空文本 + 1 次截图 ≈ 5 min 浪费。
    detect_signal: |
      同路由连续 ≥3 次 navigate + visible_text 空文本
      + dev server 日志含 "Module not found" / "ChunkLoadError" / "Failed to fetch"
      + 仍继续重 navigate（未跑 dev-hmr-recovery.ps1）
    fix_template_before: |
      # ❌ 反复重 navigate 5+ 次
      for i in 1..5:
        playwright_navigate /zh/workspace/[id]
        playwright_get_visible_text  # 仍空
    fix_template_after: |
      # ✅ 连续 3 次重 navigate 未恢复 → 必跑 recovery 脚本（不再重试）
